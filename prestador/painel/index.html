<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Prestador</title><link rel="stylesheet" href="/public/provider/provider.css"></head><body><header><a href="/"><img src="/assets/brand/reforma-profissional-oficial.jpeg" alt="Reforma Profissional — Seu espaço em boas mãos."></a></header><main class="shell"><section class="card"><h1>Painel do prestador</h1><p id="status">Carregando cadastro…</p><section id="corrections" class="alert" hidden><h2>Correções solicitadas</h2><div id="correction-list"></div></section><div class="dashboard" id="menu"></div></section></main><script>
const items=['Meu cadastro','Meus documentos','Status da análise','Contrato','Especialidades','Área de atendimento','Oportunidades','Minhas OS','Orçamentos','Serviços adicionais','Evidências/fotos','Documento fiscal','Histórico','Repasse','Suporte'],token=sessionStorage.getItem('rp_provider_session');menu.innerHTML=items.map(x=>`<section class="tile"><strong>${x}</strong><p class="muted">Consulte e acompanhe pela API segura.</p></section>`).join('');
function filePayload(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>resolve({originalName:file.name,mimeType:file.type,base64:String(reader.result).split(',')[1]});reader.readAsDataURL(file)})}
async function upload(event,type){event.preventDefault();const file=event.currentTarget.elements.file.files[0],message=event.currentTarget.querySelector('p');if(!file)return;message.textContent='Enviando…';const response=await fetch(`/api/provider/documents/${encodeURIComponent(type)}`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify(await filePayload(file))});message.textContent=response.ok?'Documento reenviado para nova análise.':'Não foi possível reenviar o documento.';if(response.ok)setTimeout(load,500)}
async function load(){if(!token){location.replace('/prestador/login/');return}const response=await fetch('/api/provider/me',{headers:{authorization:`Bearer ${token}`}});if(!response.ok){sessionStorage.removeItem('rp_provider_session');location.replace('/prestador/login/');return}const {provider}=await response.json(),pending=provider.correctionRequests||[];status.textContent=`Status da análise: ${provider.status||provider.onboardingStatus}`;corrections.hidden=!pending.length;correctionList.innerHTML=pending.map(item=>`<form data-type="${item.documentType}"><strong>${item.documentType}</strong><p>${item.message}</p><small>Motivo: ${item.reasonCode} · solicitado em ${new Date(item.requestedAt).toLocaleDateString('pt-BR')}</small><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" required><button class="btn primary">Reenviar documento</button><p role="status"></p></form>`).join('');correctionList.querySelectorAll('form').forEach(form=>form.onsubmit=event=>upload(event,form.dataset.type))}load();
</script></body></html>

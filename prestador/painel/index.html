<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Prestador</title><link rel="stylesheet" href="/public/provider/provider.css"></head><body><header><a href="/"><img src="/assets/brand/reforma-profissional-logo.svg" alt="Reforma Profissional — Seu espaço em boas mãos."></a></header><main class="shell"><section class="card"><h1>Painel do prestador</h1><p id="status">Carregando cadastro…</p><div class="dashboard" id="menu"></div></section></main><script>const items=['Meu cadastro','Meus documentos','Status da análise','Contrato','Especialidades','Área de atendimento','Oportunidades','Minhas OS','Orçamentos','Serviços adicionais','Evidências/fotos','Documento fiscal','Histórico','Repasse','Suporte'];menu.innerHTML=items.map(x=>`<section class="tile"><strong>${x}</strong><p class="muted">Consulte e acompanhe pela API segura.</p></section>`).join('');(async()=>{const token=sessionStorage.getItem('rp_provider_session');if(!token){location.replace('/prestador/login/');return}const r=await fetch('/api/provider/me',{headers:{authorization:`Bearer ${token}`}});if(!r.ok){sessionStorage.removeItem('rp_provider_session');location.replace('/prestador/login/');return}const j=await r.json();status.textContent=`Status da análise: ${j.provider.status}`})()</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Prestador</title><link rel="stylesheet" href="/public/provider/provider.css"></head><body><header><a href="/"><img src="/assets/brand/reforma-profissional-oficial.jpeg" alt="Reforma Profissional — Seu espaço em boas mãos."></a></header><main class="shell"><form id="login" class="card"><h1>Entrar como prestador</h1><label>E-mail ou telefone<input name="login" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><p id="message" role="alert"></p><button class="btn primary">Entrar</button><p><a href="/prestador/cadastro/">Ainda não tenho cadastro</a></p></form></main><script>login.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(login)),r=await fetch('/api/provider/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok){message.textContent='Credenciais inválidas ou acesso indisponível.';return}sessionStorage.setItem('rp_provider_session',j.token);location.assign('/prestador/painel/')}</script></body></html>
